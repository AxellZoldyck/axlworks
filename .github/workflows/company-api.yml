name: Company API checks
on:
  pull_request:
    paths:
      - "company-platform/**"
  push:
    branches:
      - "feat/company-platform-phase-1"
    paths:
      - "company-platform/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company-platform/backend
    env:
      DATABASE_URL: sqlite+pysqlite:///:memory:
      JWT_SECRET_KEY: test-only-secret-key-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: company-platform/backend/pyproject.toml
      - name: Install API and test dependencies
        run: pip install -e ".[test]"
      - name: Run API tests
        run: pytest -q
